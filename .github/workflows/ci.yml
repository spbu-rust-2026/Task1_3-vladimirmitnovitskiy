name: CI

on:
  push:
    branches: [main, work]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test